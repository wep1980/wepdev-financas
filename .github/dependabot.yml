version: 2
updates:
  - package-ecosystem: maven
    directory: /services/account-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: maven
    directory: /services/transaction-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /services/account-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/transaction-service
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
