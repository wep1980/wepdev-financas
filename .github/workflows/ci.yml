        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publicar-imagem
        with:
          imagem-local: ai-service:ci
          imagem-ghcr: ghcr.io/wep1980/wepdev-financas-ai-service
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Único job Node.js do CI — os outros seis são Maven/Java. Sem OWASP
  # Dependency-Check aqui (é uma ferramenta de dependência Java): gate de
  # vulnerabilidade via "npm audit" (ADR-0017, security.md seção 6,
  # CLAUDE.md princípio 7).
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Scan de vulnerabilidade (npm audit)
        run: npm audit --omit=dev
      - name: Build de produção
        run: npm run build
      # Em push na main, a imagem só é publicada depois dos gates acima.
      - name: Build da imagem Docker
        run: docker build -f Dockerfile -t web:ci .
      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publicar-imagem
        with:
          imagem-local: web:ci
          imagem-ghcr: ghcr.io/wep1980/wepdev-financas-web
          github-token: ${{ secrets.GITHUB_TOKEN }}

