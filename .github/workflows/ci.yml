name: CI

# CD (build de imagem + deploy) fica pra fatia 9 (ADR-0020/0021) — este
# workflow só cobre build + teste + scan de vulnerabilidade (ADR-0017/0018).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR de fonte externa (ex: Dependabot) recebe um GITHUB_TOKEN com permissão
# mínima por padrão — sem isso, "dorny/paths-filter" falha com "Resource not
# accessible by integration" ao tentar listar os arquivos da PR (achado
# rodando de verdade contra PR real do Dependabot, 2026-08-07).
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detecta qual serviço mudou, pra não buildar tudo a cada PR (ADR-0018).
  changes:
    runs-on: ubuntu-latest
    outputs:
      account-service: ${{ steps.filter.outputs.account-service }}
      transaction-service: ${{ steps.filter.outputs.transaction-service }}
      card-service: ${{ steps.filter.outputs.card-service }}
      document-service: ${{ steps.filter.outputs.document-service }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            account-service:
              - 'services/account-service/**'
            transaction-service:
              - 'services/transaction-service/**'
            card-service:
              - 'services/card-service/**'
            document-service:
              - 'services/document-service/**'

  account-service:
    needs: changes
    if: needs.changes.outputs.account-service == 'true'
    runs-on: ubuntu-latest
    # Sobrescreve o "pull-requests: read" do topo do arquivo só nesse job —
    # madrapps/jacoco-report precisa de write pra postar o comentário de
    # cobertura na PR.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: services/account-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/account-service/pom.xml
      - name: Testes (unitário + integração)
        run: ./mvnw test -B
      # jacoco:report já roda dentro de "mvn test" (bind na fase test, ver
      # pom.xml) — aqui só publica o HTML gerado como artefato do run.
      - name: Publicar relatório de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-account-service
          path: services/account-service/target/site/jacoco/
          retention-days: 14
      # Só faz sentido comentar numa PR de verdade — em push direto pra
      # main não tem PR pra comentar.
      - name: Comentar cobertura na PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: services/account-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Cobertura de teste — account-service
      # Só valida que a imagem continua buildando — publicar em registry e
      # fazer deploy fica pra fatia 9 (ADR-0020/0021, ver comentário no
      # topo do arquivo). -DskipTests porque os testes já rodaram acima.
      - name: Build da imagem Docker (validação, não publica)
        run: |
          ./mvnw package -B -DskipTests
          docker build -f src/main/docker/Dockerfile.jvm -t account-service:ci .
      # Precisa de NVD_API_KEY (secret do repo) — sem ela o NVD rejeita a
      # sincronização com "Invalid API Key" (validado localmente,
      # 2026-08-07). Gerar de graça em https://nvd.nist.gov/developers/request-an-api-key.
      - name: Cache da base de dados do OWASP Dependency-Check
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Scan de vulnerabilidade (OWASP Dependency-Check)
        run: ./mvnw dependency-check:check -B -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  card-service:
    needs: changes
    if: needs.changes.outputs.card-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: services/card-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/card-service/pom.xml
      - name: Testes (unitário + integração)
        run: ./mvnw test -B
      - name: Publicar relatório de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-card-service
          path: services/card-service/target/site/jacoco/
          retention-days: 14
      - name: Comentar cobertura na PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: services/card-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Cobertura de teste — card-service
      - name: Build da imagem Docker (validação, não publica)
        run: |
          ./mvnw package -B -DskipTests
          docker build -f src/main/docker/Dockerfile.jvm -t card-service:ci .
      - name: Cache da base de dados do OWASP Dependency-Check
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Scan de vulnerabilidade (OWASP Dependency-Check)
        run: ./mvnw dependency-check:check -B -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  document-service:
    needs: changes
    if: needs.changes.outputs.document-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: services/document-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/document-service/pom.xml
      - name: Testes (unitário + integração)
        run: ./mvnw test -B
      - name: Publicar relatório de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-document-service
          path: services/document-service/target/site/jacoco/
          retention-days: 14
      - name: Comentar cobertura na PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: services/document-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Cobertura de teste — document-service
      - name: Build da imagem Docker (validação, não publica)
        run: |
          ./mvnw package -B -DskipTests
          docker build -f src/main/docker/Dockerfile.jvm -t document-service:ci .
      - name: Cache da base de dados do OWASP Dependency-Check
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Scan de vulnerabilidade (OWASP Dependency-Check)
        run: ./mvnw dependency-check:check -B -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  transaction-service:
    needs: changes
    if: needs.changes.outputs.transaction-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: services/transaction-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/transaction-service/pom.xml
      - name: Testes (unitário + integração)
        run: ./mvnw test -B
      - name: Publicar relatório de cobertura (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-transaction-service
          path: services/transaction-service/target/site/jacoco/
          retention-days: 14
      - name: Comentar cobertura na PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: services/transaction-service/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Cobertura de teste — transaction-service
      - name: Build da imagem Docker (validação, não publica)
        run: |
          ./mvnw package -B -DskipTests
          docker build -f src/main/docker/Dockerfile.jvm -t transaction-service:ci .
      - name: Cache da base de dados do OWASP Dependency-Check
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Scan de vulnerabilidade (OWASP Dependency-Check)
        run: ./mvnw dependency-check:check -B -DnvdApiKey=${{ secrets.NVD_API_KEY }}
