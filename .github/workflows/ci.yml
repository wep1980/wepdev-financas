  ai-service:
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    defaults:
      run:
        working-directory: services/ai-service
    steps:
