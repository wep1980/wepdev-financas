# Valores de MYSQL_ROOT_PASSWORD etc. abaixo têm default de DEV (ver
# .env.example) — só pra rodar local sem setup extra. Nunca usados em
# produção nesse formato; ver docs/architecture/security.md.
version: "3.9"

networks:
  financas-net:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  keycloak-data:
  qdrant-data:

services:

  # ================= Bancos de dados =================
  mysql:
    image: mysql:8.4
    container_name: financas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-financas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-financas}
      MYSQL_DATABASE: account_db
    ports:
      # 3307 no host (não 3306) — já existe um MySQL local rodando na sua
      # máquina fora do Docker; dentro da rede Docker os serviços continuam
      # falando "mysql:3306" normalmente, só o acesso pelo host muda.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    networks: [financas-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: financas-redis
    ports:
      - "6379:6379"
    networks: [financas-net]

  mongo:
    image: mongo:7
    container_name: financas-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-financas}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-financas}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks: [financas-net]

  # Vector store pro RAG do ai-service (ADR-0005, confirmado 2026-08-10) —
  # embeddings de descrição de transação/lançamento pra busca semântica.
  # 6333 = REST/HTTP (dashboard em /dashboard), 6334 = gRPC (cliente Java).
  qdrant:
    image: qdrant/qdrant:latest
    container_name: financas-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [financas-net]

  # Provedor de LLM (ADR-0002) — ADR-0029: Ollama deixou de rodar local
  # (container neste compose) e passou a rodar no servidor de produção,
  # numa RTX 5070 Ti dedicada. Motivo: inferência em CPU só (sem GPU)
  # media ~4 tokens/s e só processava UMA geração por vez — chat e
  # extração de fatura brigavam pelo mesmo slot e estouravam timeout uma
  # da outra (achado real, 2026-08-11). Com GPU: ~127 tokens/s, 4 slots
  # paralelos, os dois cenários resolvidos concorrentemente em segundos.
  # `document-service`/`ai-service` agora apontam pra lá via
  # `OLLAMA_SERVER_URL` (ver `.env`, nunca versionado — endereço de rede
  # interna não entra em arquivo commitado, mesma regra de sempre).

  # ================= Identidade =================
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: financas-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      # Fixa o "issuer" de todo token emitido, não importa se quem pediu
      # foi um humano via localhost:8080 ou um container via rede interna
      # (keycloak:8080) — sem isso, cada lado vê um issuer diferente e a
      # validação de token rejeita com 401 (ver account-service e
      # transaction-service application.properties, que compensam o
      # discovery document também virar "localhost" com discovery-enabled=false).
      KC_HOSTNAME: localhost
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-financas.json:/opt/keycloak/data/import/realm-financas.json
      - keycloak-data:/opt/keycloak/data
    networks: [financas-net]

  # ================= Mensageria =================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: financas-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [financas-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: financas-kafka
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    networks: [financas-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: financas-kafka-ui
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: financas
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8090:8080"
    networks: [financas-net]

  # ================= Observabilidade =================
  prometheus:
    image: prom/prometheus:latest
    container_name: financas-prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [financas-net]

  grafana:
    image: grafana/grafana:latest
    container_name: financas-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks: [financas-net]

  # ================= Microsserviços =================
  account-service:
    build:
      context: ./services/account-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: financas-account-service
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_started }
      keycloak: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/account_db
      DB_USER: ${MYSQL_USER:-financas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-financas}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8081:8081"
    networks: [financas-net]

  transaction-service:
    build:
      context: ./services/transaction-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: financas-transaction-service
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_started }
      account-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/transaction_db
      DB_USER: ${MYSQL_USER:-financas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-financas}
      KAFKA_BOOTSTRAP: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      TRANSACTION_SERVICE_CLIENT_SECRET: ${TRANSACTION_SERVICE_CLIENT_SECRET:-changeit}
      ACCOUNT_SERVICE_URL: http://account-service:8081
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8082:8082"
    networks: [financas-net]

  card-service:
    build:
      context: ./services/card-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: financas-card-service
    depends_on:
      mysql: { condition: service_healthy }
      account-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/card_db
      DB_USER: ${MYSQL_USER:-financas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-financas}
      KEYCLOAK_URL: http://keycloak:8080
      CARD_SERVICE_CLIENT_SECRET: ${CARD_SERVICE_CLIENT_SECRET:-changeit}
      ACCOUNT_SERVICE_URL: http://account-service:8081
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8083:8083"
    networks: [financas-net]

  document-service:
    build:
      context: ./services/document-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: financas-document-service
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_started }
      kafka: { condition: service_started }
      card-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/document_db
      DB_USER: ${MYSQL_USER:-financas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-financas}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-financas}:${MONGO_ROOT_PASSWORD:-financas}@mongo:27017
      KAFKA_BOOTSTRAP: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      # Fatura de cartão passou a religar direto no card-service (ADR-0028,
      # não mais no account-service — a integração antiga foi removida).
      CARD_SERVICE_URL: http://card-service:8083
      # Ollama agora roda no servidor (GPU dedicada), não mais neste compose
      # — ADR-0029. Endereço real (IP da rede local) só em `.env`
      # (gitignored), nunca aqui — mesma regra de sempre pra dado de rede.
      OLLAMA_BASE_URL: ${OLLAMA_SERVER_URL}
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8084:8084"
    networks: [financas-net]

  budget-service:
    build:
      context: ./services/budget-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: financas-budget-service
    depends_on:
      mysql: { condition: service_healthy }
      account-service: { condition: service_started }
      card-service: { condition: service_started }
      transaction-service: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/budget_db
      DB_USER: ${MYSQL_USER:-financas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-financas}
      KEYCLOAK_URL: http://keycloak:8080
      ACCOUNT_SERVICE_URL: http://account-service:8081
      CARD_SERVICE_URL: http://card-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8085:8085"
    networks: [financas-net]

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: financas-ai-service
    depends_on:
      mongo: { condition: service_started }
      qdrant: { condition: service_started }
      kafka: { condition: service_started }
      account-service: { condition: service_started }
      budget-service: { condition: service_started }
      card-service: { condition: service_started }
      transaction-service: { condition: service_started }
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-financas}:${MONGO_ROOT_PASSWORD:-financas}@mongo:27017
      QDRANT_URL: http://qdrant:6333
      KAFKA_BOOTSTRAP: kafka:9092
      KEYCLOAK_URL: http://keycloak:8080
      ACCOUNT_SERVICE_URL: http://account-service:8081
      BUDGET_SERVICE_URL: http://budget-service:8085
      CARD_SERVICE_URL: http://card-service:8083
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      # Ollama agora roda no servidor (GPU dedicada), não mais neste compose
      # — ADR-0029. Endereço real (IP da rede local) só em `.env`
      # (gitignored), nunca aqui. AI_SERVICE_CRIPTOGRAFIA_CHAVE também não —
      # default de dev já embutido no application.properties, produção usa
      # Vault (docs/architecture/security.md).
      OLLAMA_BASE_URL: ${OLLAMA_SERVER_URL}
      OTEL_ENDPOINT: http://otel-collector:4317
    ports:
      - "8086:8086"
    networks: [financas-net]

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: financas-web
    depends_on:
      keycloak: { condition: service_started }
      account-service: { condition: service_started }
      transaction-service: { condition: service_started }
      card-service: { condition: service_started }
      document-service: { condition: service_started }
      budget-service: { condition: service_started }
      ai-service: { condition: service_started }
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-Bw/IG0xCGSqVzl1IyUPZ2nsDrVXV8jy3+oa6K23zT6IO}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      AUTH_KEYCLOAK_ID: web-app
      # Alcançável só pelo navegador (redirect de login/logout) — o
      # servidor Next.js roda dentro deste container, que não alcança
      # "localhost:8080" (é o próprio container). Ver auth.ts.
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/financas
      # Alcançável pelo servidor (dentro da rede Docker) — troca/renovação
      # de token, userinfo, jwks. Ver auth.ts.
      AUTH_KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/financas
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
      CARD_SERVICE_URL: http://card-service:8083
      DOCUMENT_SERVICE_URL: http://document-service:8084
      BUDGET_SERVICE_URL: http://budget-service:8085
      AI_SERVICE_URL: http://ai-service:8086
    ports:
      - "3000:3000"
    networks: [financas-net]
