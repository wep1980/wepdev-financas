quarkus.application.name=document-service

# ---- Datasource (MySQL — só LancamentoPendente, queryable; documento bruto
# fica no Mongo abaixo) ----
# dev/prod tem URL explicita; %test fica sem URL de propósito, assim o
# Quarkus Dev Services sobe um MySQL descartável via Testcontainers sozinho
# (ver docs/architecture/testing-strategy.md).
quarkus.datasource.db-kind=mysql
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/document_db
%dev.quarkus.datasource.username=${DB_USER:financas}
%dev.quarkus.datasource.password=${DB_PASSWORD:financas}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Schema é gerenciado por Flyway, nunca pelo Hibernate.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ---- MongoDB (documento bruto + resultado do parsing, ver overview.md) ----
%dev.quarkus.mongodb.connection-string=mongodb://${MONGO_ROOT_USER:financas}:${MONGO_ROOT_PASSWORD:financas}@localhost:27017
%prod.quarkus.mongodb.connection-string=${MONGO_URL}
quarkus.mongodb.database=document_service
# Dev Services sobe um Mongo descartável em teste (mesmo racional do MySQL acima).
# @BsonId é UUID (DocumentoImportadoEntity) — sem isso o driver recusa
# codificar UUID (CodecConfigurationException), testado na prática.
quarkus.mongodb.uuid-representation=standard

# ---- OIDC / Keycloak — autenticação de entrada (ADR-0003) ----
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/financas
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/financas
quarkus.oidc.client-id=document-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Testes usam @TestSecurity (mock de identidade) — não precisa de Keycloak real.
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/none
# Ver account-service/application.properties — mesmo motivo (KC_HOSTNAME
# fixo no Keycloak + discovery desabilitado, pra funcionar de dentro de
# container sem quebrar a validação do issuer do token).
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_ISSUER_URL:http://localhost:8080}/realms/financas

# ---- REST Client — account-service (ADR-0025, só confirma posse de
# conta antes de publicar o evento de confirmação) ----
%dev.quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
%prod.quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL}
%test.quarkus.rest-client.account-service.url=http://localhost:8081

# ---- Kafka — produz documento.lancamentos-confirmados (consumido pelo
# transaction-service, ver overview.md seção 3) ----
%dev.kafka.bootstrap.servers=localhost:29092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP}
mp.messaging.outgoing.documento-lancamentos-confirmados.connector=smallrye-kafka
mp.messaging.outgoing.documento-lancamentos-confirmados.topic=documento.lancamentos-confirmados
mp.messaging.outgoing.documento-lancamentos-confirmados.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# ---- LLM (ADR-0002/ADR-0015) — Ollama local, único provedor implementado
# nessa fatia (OpenAI fica pra quando o usuário puder configurar a própria
# chave, ver ai-strategy.md seção 1) ----
# 11500 no host, não 11434 — testado na prática (2026-08-09) que uma
# instalação nativa do Ollama no Windows disputa a porta 11434 com o
# container e "rouba" conexão IPv4 (ver comentário em docker-compose.yml).
# Dentro da rede Docker o hostname continua sendo "ollama:11434" normalmente.
%dev.quarkus.rest-client.ollama.url=${OLLAMA_BASE_URL:http://localhost:11500}
%prod.quarkus.rest-client.ollama.url=${OLLAMA_BASE_URL:http://ollama:11434}
%test.quarkus.rest-client.ollama.url=http://localhost:11500
document-service.llm.ollama.model=${OLLAMA_MODEL:llama3.1:latest}

# ---- OpenAPI / Swagger UI ----
mp.openapi.extensions.smallrye.info.title=document-service — Sistema de Finanças Pessoais
mp.openapi.extensions.smallrye.info.version=1.0.0

# ---- Observabilidade ----
# Ver account-service/application.properties — mesmo motivo (sem
# otel-collector no compose ainda, evita o Quarkus tentar provisionar LGTM
# sozinho em quarkus:dev).
%dev.quarkus.observability.lgtm.enabled=false
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT}
%test.quarkus.otel.sdk.disabled=true

# ---- HTTP ----
quarkus.http.port=8084
# Upload de PDF de fatura — limite generoso o bastante pra fatura de várias
# páginas, sem abrir a porta pra upload absurdo.
quarkus.http.limits.max-body-size=10M
