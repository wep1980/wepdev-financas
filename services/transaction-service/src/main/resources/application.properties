quarkus.application.name=transaction-service

# ---- Datasource ----
# dev/prod tem URL explicita; %test fica sem URL de propósito, assim o
# Quarkus Dev Services sobe um MySQL descartável via Testcontainers sozinho
# (ver docs/architecture/testing-strategy.md).
quarkus.datasource.db-kind=mysql
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/transaction_db
%dev.quarkus.datasource.username=${DB_USER:financas}
%dev.quarkus.datasource.password=${DB_PASSWORD:financas}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Schema é gerenciado por Flyway, nunca pelo Hibernate.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ---- Kafka ----
%dev.kafka.bootstrap.servers=localhost:29092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP}
mp.messaging.outgoing.transacao-eventos.connector=smallrye-kafka
mp.messaging.outgoing.transacao-eventos.topic=transacao.eventos
mp.messaging.outgoing.transacao-eventos.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Consome o evento publicado pelo document-service (overview.md seção 3,
# ADR-0023) — cria Transacao avulsa por lançamento confirmado.
mp.messaging.incoming.documento-lancamentos-confirmados.connector=smallrye-kafka
mp.messaging.incoming.documento-lancamentos-confirmados.topic=documento.lancamentos-confirmados
mp.messaging.incoming.documento-lancamentos-confirmados.value.deserializer=br.com.wepdev.financas.transaction.infrastructure.messaging.DocumentoLancamentosConfirmadosDeserializer
mp.messaging.incoming.documento-lancamentos-confirmados.group.id=transaction-service

# ---- OIDC / Keycloak — autenticação de entrada (ADR-0003) ----
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/financas
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/financas
quarkus.oidc.client-id=transaction-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Testes usam @TestSecurity (mock de identidade) — não precisa de Keycloak real.
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/none
# Ver account-service/application.properties — mesmo motivo (KC_HOSTNAME
# fixo no Keycloak + discovery desabilitado, pra funcionar de dentro de
# container sem quebrar a validação do issuer do token).
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_ISSUER_URL:http://localhost:8080}/realms/financas

# ---- OIDC Client — chamada de saída pro account-service (client_credentials) ----
# Mesmo client "transaction-service" do Keycloak, mas aqui no papel de
# client OAuth2 (client credentials), não de resource server. Token gerado
# tem a role "service" (ver infra/keycloak/realm-financas.json) — é o que o
# endpoint interno /contas/{id}/debitos|creditos exige.
%dev.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/financas
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL}/realms/financas
quarkus.oidc-client.client-id=transaction-service
quarkus.oidc-client.credentials.secret=${TRANSACTION_SERVICE_CLIENT_SECRET:changeit}
quarkus.oidc-client.grant.type=client
%test.quarkus.oidc-client.auth-server-url=http://localhost:8180/realms/none
# Mesmo motivo do quarkus.oidc acima — sem isso, o oidc-client tentaria
# usar o token_endpoint absoluto ("localhost") que o discovery document
# devolve, inalcançável de dentro do container.
%prod.quarkus.oidc-client.discovery-enabled=false
%prod.quarkus.oidc-client.token-path=protocol/openid-connect/token

# ---- REST Client — account-service ----
%dev.quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
%prod.quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL}
%test.quarkus.rest-client.account-service.url=http://localhost:8081

# ---- OpenAPI / Swagger UI ----
mp.openapi.extensions.smallrye.info.title=transaction-service — Sistema de Finanças Pessoais
mp.openapi.extensions.smallrye.info.version=1.0.0

# ---- Observabilidade ----
# Ver account-service/application.properties — mesmo motivo (sem
# otel-collector no compose ainda, evita o Quarkus tentar provisionar LGTM
# sozinho em quarkus:dev).
%dev.quarkus.observability.lgtm.enabled=false
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT}
%test.quarkus.otel.sdk.disabled=true

# ---- HTTP ----
quarkus.http.port=8082

# ---- Scheduler ----
# Desabilitado em teste: GerarOcorrenciasRecorrentesJob é só um wrapper fino
# do relógio real sobre GerarOcorrenciasRecorrentesUseCase, que os testes
# chamam direto com datas controladas — não queremos o cron rodando em
# paralelo com a suíte.
%test.quarkus.scheduler.enabled=false
