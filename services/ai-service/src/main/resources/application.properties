quarkus.application.name=ai-service

# ---- MongoDB (histórico de conversas — Conversa/Mensagem, ver
# ai-strategy.md seção 5) ----
%dev.quarkus.mongodb.connection-string=mongodb://${MONGO_ROOT_USER:financas}:${MONGO_ROOT_PASSWORD:financas}@localhost:27017
%prod.quarkus.mongodb.connection-string=${MONGO_URL}
quarkus.mongodb.database=ai_service
# Dev Services sobe um Mongo descartável em teste (mesmo racional dos
# outros serviços que usam Mongo). uuid-representation=standard — mesmo
# achado do document-service (CodecConfigurationException sem isso,
# quando @BsonId é UUID).
quarkus.mongodb.uuid-representation=standard

# ---- OIDC / Keycloak — autenticação de entrada (ADR-0003) ----
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/financas
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/financas
quarkus.oidc.client-id=ai-service
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Testes usam @TestSecurity (mock de identidade) — não precisa de Keycloak real.
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/none
# Ver account-service/application.properties — mesmo motivo (KC_HOSTNAME
# fixo no Keycloak + discovery desabilitado, pra funcionar de dentro de
# container sem quebrar a validação do issuer do token).
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_ISSUER_URL:http://localhost:8080}/realms/financas

# ---- Criptografia da apiKey da OpenAI por usuário (ADR-0002,
# security.md: "Banco do ai-service, campo criptografado") — AES-256,
# chave em Base64. Default abaixo é só de DEV (gerado com
# `openssl rand -base64 32`, sem risco real por ser público neste
# arquivo) — produção usa AI_SERVICE_CRIPTOGRAFIA_CHAVE via Vault, nunca
# esse valor. ----
ai-service.criptografia.chave=${AI_SERVICE_CRIPTOGRAFIA_CHAVE:+7DZ1yuHOmLzS3OXGTcXL8ped8qz0OhLpzFJXdGQNdo=}

# ---- LLM (ADR-0002, ai-strategy.md) — Ollama e OpenAI, resolvidos por
# usuário em runtime via LlmProviderFactory (nunca os dois hardcoded
# junto, só um por chamada, conforme ConfiguracaoIa do usuário). ----
%dev.quarkus.rest-client.ollama.url=${OLLAMA_BASE_URL:http://localhost:11500}
%prod.quarkus.rest-client.ollama.url=${OLLAMA_BASE_URL:http://ollama:11434}
%test.quarkus.rest-client.ollama.url=http://localhost:11500
ai-service.llm.ollama.model=${OLLAMA_MODEL:llama3.1:latest}
# Modelo dedicado a embedding (RAG, item 7) — precisa ser puxado à parte
# do modelo de chat (`ollama pull nomic-embed-text`), não vem junto do
# llama3.1.
ai-service.llm.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
# read-timeout do REST client (nível de conector) default é 30s — bem menor
# que o @Timeout do SmallRye Fault Tolerance em OllamaRestClient (120s pro
# /api/generate, 60s pro /api/embeddings), e o menor dos dois sempre vence.
# Sem essa propriedade o @Timeout nunca tinha efeito de verdade — mesmo
# achado já corrigido no document-service (docs/historico.md 2026-08-10),
# só apareceu aqui agora (2026-08-11) porque a classificação de intenção
# das novas tools de cartão/parcelamento levou mais que 30s numa chamada
# real. 130000ms, acima do maior @Timeout (120s) desse client.
quarkus.rest-client.ollama.read-timeout=130000

# Base URL da OpenAI é sempre fixa — só a apiKey varia por usuário,
# passada por chamada (ver OpenAiRestClient/OpenAiLlmProvider), nunca
# fica configurada aqui.
quarkus.rest-client.openai.url=https://api.openai.com

# ---- REST Clients de saída — account-service/budget-service/card-service/
# transaction-service (tools MCP de leitura + criar_transacao, a única
# de escrita — ai-strategy.md seção 4). account-service é usado só pelo
# agente orquestrador (item 8) pra resolver "conta corrente"/"carteira"
# (texto livre) pro id de verdade antes de propor uma ação — nenhuma
# tool de consulta usa (o budget-service já agrega saldo de conta no
# cálculo de disponível pra gastar, ADR-0026). Todos propagam o token do
# próprio usuário — sem confirmação de posse, os endpoints já filtram
# pelo sub do token (mesmo padrão do budget-service, ADR-0026). ----
%dev.quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
%prod.quarkus.rest-client.account-service.url=${ACCOUNT_SERVICE_URL}
%test.quarkus.rest-client.account-service.url=http://localhost:8081

%dev.quarkus.rest-client.budget-service.url=${BUDGET_SERVICE_URL:http://localhost:8085}
%prod.quarkus.rest-client.budget-service.url=${BUDGET_SERVICE_URL}
%test.quarkus.rest-client.budget-service.url=http://localhost:8085

%dev.quarkus.rest-client.card-service.url=${CARD_SERVICE_URL:http://localhost:8083}
%prod.quarkus.rest-client.card-service.url=${CARD_SERVICE_URL}
%test.quarkus.rest-client.card-service.url=http://localhost:8083

%dev.quarkus.rest-client.transaction-service.url=${TRANSACTION_SERVICE_URL:http://localhost:8082}
%prod.quarkus.rest-client.transaction-service.url=${TRANSACTION_SERVICE_URL}
%test.quarkus.rest-client.transaction-service.url=http://localhost:8082

# ---- Kafka — consome "transacao.eventos" pra indexar embedding no
# Qdrant (RAG, item 7, ai-strategy.md seção 2). Primeiro consumer desse
# tópico. ----
%dev.kafka.bootstrap.servers=localhost:29092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP}
mp.messaging.incoming.transacao-eventos.connector=smallrye-kafka
mp.messaging.incoming.transacao-eventos.topic=transacao.eventos
mp.messaging.incoming.transacao-eventos.value.deserializer=br.com.wepdev.financas.ai.infrastructure.messaging.TransacaoRegistradaDeserializer
mp.messaging.incoming.transacao-eventos.group.id=ai-service

# ---- Qdrant (ADR-0005) — vector store pro RAG. dimensao-vetor=768
# precisa bater com a saída do modelo de embedding configurado acima
# (ai-service.llm.ollama.embedding-model=nomic-embed-text → 768;
# trocar de modelo de embedding sem recriar a coleção quebra a busca,
# ver QdrantColecaoInicializador). ----
%dev.quarkus.rest-client.qdrant.url=${QDRANT_URL:http://localhost:6333}
%prod.quarkus.rest-client.qdrant.url=${QDRANT_URL:http://qdrant:6333}
%test.quarkus.rest-client.qdrant.url=http://localhost:6333
ai-service.qdrant.colecao=transacoes
ai-service.qdrant.dimensao-vetor=768
%prod.ai-service.qdrant.api-key=${QDRANT_API_KEY}

# ---- OpenAPI / Swagger UI ----
mp.openapi.extensions.smallrye.info.title=ai-service — Sistema de Finanças Pessoais
mp.openapi.extensions.smallrye.info.version=1.0.0

# ---- Observabilidade ----
# Ver account-service/application.properties — mesmo motivo (sem
# otel-collector no compose ainda, evita o Quarkus tentar provisionar LGTM
# sozinho em quarkus:dev).
%dev.quarkus.observability.lgtm.enabled=false
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT}
%test.quarkus.otel.sdk.disabled=true

# ---- HTTP ----
quarkus.http.port=8086
