quarkus.application.name=account-service

# ---- Datasource ----
# dev/prod tem URL explicita; %test fica sem URL de propósito, assim o
# Quarkus Dev Services sobe um MySQL descartável via Testcontainers sozinho
# (ver docs/architecture/testing-strategy.md).
quarkus.datasource.db-kind=mysql
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3307/account_db
%dev.quarkus.datasource.username=${DB_USER:financas}
%dev.quarkus.datasource.password=${DB_PASSWORD:financas}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Schema é gerenciado por Flyway, nunca pelo Hibernate (ADR de spec-driven:
# migração versionada, não geração automática).
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# ---- Kafka ----
%dev.kafka.bootstrap.servers=localhost:29092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP}
mp.messaging.outgoing.conta-eventos.connector=smallrye-kafka
mp.messaging.outgoing.conta-eventos.topic=conta.eventos
mp.messaging.outgoing.conta-eventos.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# ---- OIDC / Keycloak (ADR-0003) ----
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8080}/realms/financas
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/financas
quarkus.oidc.client-id=account-service
quarkus.oidc.application-type=service
# KC_HOSTNAME fixo no Keycloak (docker-compose.yml) garante que TODO token
# emitido tem o mesmo "issuer", não importa se quem pediu foi um humano via
# acesso externo (localhost:8080) ou um container via rede interna
# (keycloak:8080). Mas isso também faz o discovery document devolver URLs
# absolutas em "localhost", inalcançáveis de dentro de um container — por
# isso desabilita discovery e aponta os paths manualmente (relativos a
# auth-server-url, que continua sendo a rede interna, alcançável).
# Em produção, ajustar KEYCLOAK_ISSUER_URL pro domínio público do Keycloak.
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%prod.quarkus.oidc.token.issuer=${KEYCLOAK_ISSUER_URL:http://localhost:8080}/realms/financas
# Keycloak coloca as roles em realm_access.roles, não no claim default do
# Quarkus (groups) — sem isso @RolesAllowed nunca reconhece o token.
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Testes usam @TestSecurity (mock de identidade) — não precisa de Keycloak real.
%test.quarkus.oidc.auth-server-url=http://localhost:8180/realms/none

# ---- OpenAPI / Swagger UI (pra importar no Postman: /q/openapi) ----
mp.openapi.extensions.smallrye.info.title=account-service — Sistema de Finanças Pessoais
mp.openapi.extensions.smallrye.info.version=1.0.0

# ---- Observabilidade ----
# docker-compose ainda não tem serviço `otel-collector` (só prometheus/grafana
# hoje) — sem isso, o Quarkus tenta provisionar sozinho um stack LGTM via Dev
# Services (`quarkus.observability.lgtm.enabled`, default true) em
# `quarkus:dev`, o que trava/falha localmente. Desabilitado até o collector
# existir de verdade no compose.
%dev.quarkus.observability.lgtm.enabled=false
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT}
%test.quarkus.otel.sdk.disabled=true

# ---- HTTP ----
quarkus.http.port=8081
